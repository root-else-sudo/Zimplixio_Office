title = "Zimplixio gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api03-)?[A-Za-z0-9_-]{20,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''tvly-(?:dev-)?[A-Za-z0-9]{20,}'''
tags = ["key", "tavily"]

[[rules]]
id = "twilio-account-sid"
description = "Twilio Account SID"
regex = '''AC[0-9a-f]{32}'''
tags = ["key", "twilio"]

[[rules]]
id = "twilio-api-key-sid"
description = "Twilio API Key SID"
regex = '''SK[0-9a-f]{32}'''
tags = ["key", "twilio"]
